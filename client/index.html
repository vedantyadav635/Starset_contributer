<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">

<head>
  <script>
    // Apply the stored theme before first paint. Light is the default.
    (function () {
      try {
        var stored = localStorage.getItem('starset-theme');
        var isDark = stored === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.classList.toggle('light', !isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- ═══════════════ PRIMARY ═══════════════ -->
  <title>Starset — Human audio data for AI</title>
  <meta name="description"
    content="Starset collects and structures human audio data for speech, voice and conversational AI. Contributors record real voices; AI teams receive validated, documented datasets." />
  <meta name="author" content="Starset" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <link rel="canonical" href="https://www.starset.online/" />
  <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-title" content="Starset" />
  <meta name="application-name" content="Starset" />
  <meta name="format-detection" content="telephone=no" />

  <!-- ═══════════════ ICONS ═══════════════ -->
  <link rel="icon" type="image/png" href="/logo.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- ═══════════════ OPEN GRAPH ═══════════════ -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Starset" />
  <meta property="og:url" content="https://www.starset.online/" />
  <meta property="og:title" content="Starset — Human audio data for AI" />
  <meta property="og:description"
    content="Real voices. Structured data. Better AI. Starset helps AI teams collect and build high-quality human audio datasets." />
  <meta property="og:image" content="https://www.starset.online/logo.png" />
  <meta property="og:image:alt" content="Starset" />
  <meta property="og:locale" content="en_US" />

  <!-- ═══════════════ TWITTER ═══════════════ -->

  <meta name="twitter:title" content="Starset — Human audio data for AI" />
  <meta name="twitter:description"
    content="Real voices. Structured data. Better AI. Human audio datasets for speech, voice and conversational AI." />
  <meta name="twitter:image" content="https://www.starset.online/logo.png" />

  <!-- ═══════════════ STRUCTURED DATA ═══════════════ -->
  <script type="application/ld+json">
  [
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Starset",

      "url": "https://www.starset.online/",
      "description": "Human audio data collection and dataset preparation for AI.",
      "inLanguage": "en"
    },
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Starset",
      "url": "https://www.starset.online/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.starset.online/logo.png"
      },

          "@type": "ContactPoint",

  <!-- ═══════════════ FONTS ═══════════════ -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet"

<body>

  <!-- ═══════════════ SPLASH / LOADING SCREEN ═══════════════ -->
  <div id="splash-screen" style="
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0b0c0e;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  ">
    <img
      src="/app-icon.jpg"
      alt="Starset"
      style="
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 24px;
        animation: splash-pulse 2s ease-in-out infinite;
      "
    />
    <p style="
      margin-top: 24px;
      font-family: 'Inter Tight', 'Inter', system-ui, sans-serif;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
    ">STARSET</p>
    <div style="
      margin-top: 32px;
      width: 36px;
      height: 36px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    "></div>
  </div>
  <style>
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255,255,255,0.08)); }
      50%       { transform: scale(1.04); filter: drop-shadow(0 0 40px rgba(255,255,255,0.18)); }
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>

  <script>
    // Hide splash once React has mounted
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.opacity = '0';
          splash.style.visibility = 'hidden';
          setTimeout(() => splash.remove(), 600);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });

    // Fallback: force-hide after 6 seconds
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.visibility = 'hidden';
        setTimeout(() => splash.remove(), 600);
      }
    }, 6000);
  </script>
</body>

</html>
